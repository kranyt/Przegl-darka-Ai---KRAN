name: Budowanie APK DziobSi
on:
  push:
    branches: [main, ccr-b750805c-pi5q7j]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Sprawdź dostępność modelu AI (informacyjnie)
        continue-on-error: true
        run: |
          curl -s 'https://huggingface.co/api/models?search=Bielik&limit=100' | python3 -c "import sys,json; [print('MODEL', m['id']) for m in json.load(sys.stdin) if 'gguf' in m['id'].lower()]" || true
          for r in speakleash/Bielik-1.5B-v3.0-Instruct-GGUF speakleash/Bielik-1.5B-v3.0-Instruct-GGUF-Q4_K_M second-state/Bielik-1.5B-v3.0-Instruct-GGUF bartowski/Bielik-1.5B-v3.0-Instruct-GGUF; do
            echo "== $r"; curl -s "https://huggingface.co/api/models/$r/tree/main" | python3 -c "import sys,json
          try:
            d=json.load(sys.stdin)
            [print(f.get('path'), f.get('size')) for f in d if str(f.get('path','')).endswith('.gguf')] if isinstance(d,list) else print(d)
          except Exception as e: print('ERR',e)"
          done
      - name: Zależności i pliki aplikacji
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Budowanie APK
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DziobSi.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DziobSi-apk
          path: DziobSi.apk
      - name: Wydanie (Releases) – do pobrania na telefon
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: DziobSi APK (wersja ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: DziobSi.apk
          body: |
            🐦 **DziobSi – Dziob Inteligence**
            Pobierz **DziobSi.apk** na telefonie z Androidem i zainstaluj
            (zezwól na instalację z nieznanych źródeł, jeśli telefon zapyta).
