<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1600px;height:900px;overflow:hidden;font-family:"DejaVu Sans Mono",monospace;font-weight:bold;}
#bg{position:absolute;inset:0;background:url(BG) center 38%/1750px auto;filter:saturate(1.05)}
.s{text-shadow:2px 2px 0 #3f3f3f}
.c0{color:#000}.gold{color:#FFAA00}.yellow{color:#FFFF55}.white{color:#fff}.gray{color:#AAAAAA}.dgray{color:#555}
.aqua{color:#55FFFF}.red{color:#FF5555}.green{color:#55FF55}.lp{color:#FF55FF}.dred{color:#AA0000}.blue{color:#5555FF}.dgreen{color:#00AA00}.dpurple{color:#AA00AA}
#boss{position:absolute;top:14px;left:50%;transform:translateX(-50%);text-align:center;font-size:17px}
#bar{width:546px;height:13px;margin:6px auto 0;background:#3a3a10;border:2px solid #111;position:relative}
#bar i{position:absolute;left:0;top:0;bottom:0;width:63%;background:linear-gradient(#ffff70,#d8c000)}
#bar b{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 26px,rgba(0,0,0,.45) 26px 27px)}
#side{position:absolute;right:6px;top:270px;background:rgba(0,0,0,.42);font-size:17px;min-width:250px;padding-bottom:4px}
#side .t{background:rgba(0,0,0,.25);text-align:center;padding:3px 0}
#side div{padding:1px 8px;height:21px;display:flex;justify-content:space-between}
#chat{position:absolute;left:6px;bottom:96px;width:640px;font-size:16px}
#chat div{background:rgba(0,0,0,.5);padding:1px 6px;white-space:pre}
#act{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);font-size:18px;white-space:pre}
#hot{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;border:3px solid #222;background:rgba(80,80,80,.7)}
#hot span{width:52px;height:52px;border:2px solid #8b8b8b;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:26px}
#hot span.sel{border:3px solid #fff}
#hearts{position:absolute;bottom:72px;left:calc(50% - 237px);color:#e22;font-size:19px;letter-spacing:-1px}
#tag{position:absolute;right:12px;bottom:8px;font-size:13px;color:#ddd;background:rgba(0,0,0,.6);padding:3px 8px;font-family:"DejaVu Sans";font-weight:normal}
#tab{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.78);font-size:16px;padding:6px 0;text-align:center;min-width:760px}
#tab .g{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;padding:6px 10px;text-align:left}
#tab .g div{background:rgba(255,255,255,.12);padding:2px 6px;display:flex;justify-content:space-between}
#title{position:absolute;top:470px;width:100%;text-align:center}
</style></head><body><div id="bg"></div>

</body></html>
